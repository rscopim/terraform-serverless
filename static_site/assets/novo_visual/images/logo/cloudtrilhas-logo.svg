<svg width="320" height="80" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente principal do ícone -->
    <linearGradient id="iconMain" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Gradiente interno brilhante -->
    <linearGradient id="innerGlow" x1="20" y1="15" x2="55" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#c7d2fe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Gradiente da trilha -->
    <linearGradient id="trailGrad" x1="18" y1="48" x2="58" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Outer glow -->
    <filter id="outerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feFlood flood-color="#6366f1" flood-opacity="0.3"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="90" y1="25" x2="300" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <linearGradient id="accentText" x1="90" y1="30" x2="220" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- === ÍCONE === -->
  <!-- Fundo com cantos arredondados e gradiente -->
  <rect x="4" y="4" width="72" height="72" rx="20" fill="url(#iconMain)" filter="url(#outerGlow)"/>

  <!-- Reflexo de vidro no topo -->
  <path d="M4 24C4 12.954 12.954 4 24 4H56C67.046 4 76 12.954 76 24V30C76 30 60 38 40 38C20 38 4 30 4 30V24Z" fill="white" opacity="0.08"/>

  <!-- Nuvem principal - forma orgânica -->
  <path d="M24 48H54C58.5 48 62 44.5 62 40C62 35.5 58.5 32 54 32C52.5 26.5 47.5 23 42 23C35 23 29.5 28 29 34.5C25.5 35 23 37.5 23 40.5C23 44 25.5 47 28 48" 
    stroke="url(#innerGlow)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Trilha ascendente com curva dinâmica -->
  <path d="M22 54C28 46 35 43 42 46C49 49 54 44 60 38" 
    stroke="url(#trailGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>

  <!-- Pontos de energia na trilha -->
  <circle cx="28" cy="50" r="2.5" fill="#f0abfc" opacity="0.9"/>
  <circle cx="28" cy="50" r="4.5" fill="#f0abfc" opacity="0.2"/>

  <circle cx="42" cy="46" r="2.5" fill="#ffffff" opacity="0.95"/>
  <circle cx="42" cy="46" r="5" fill="#ffffff" opacity="0.15"/>

  <circle cx="56" cy="40" r="2.5" fill="#67e8f9" opacity="0.9"/>
  <circle cx="56" cy="40" r="4.5" fill="#67e8f9" opacity="0.2"/>

  <!-- Estrela/spark no topo -->
  <path d="M58 18L59.5 21L63 21.5L60.5 24L61 27.5L58 26L55 27.5L55.5 24L53 21.5L56.5 21Z" fill="white" opacity="0.7"/>

  <!-- Partículas flutuantes -->
  <circle cx="18" cy="28" r="1.5" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="66" cy="55" r="1.2" fill="#67e8f9" opacity="0.5"/>
  <circle cx="14" cy="58" r="1" fill="#f0abfc" opacity="0.4"/>

  <!-- === TEXTO === -->
  <!-- "Cloud" em peso bold -->
  <text x="92" y="44" font-family="Inter, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="url(#textGrad)">Cloud</text>

  <!-- "Trilhas" com gradiente accent -->
  <text x="172" y="44" font-family="Inter, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-1" fill="url(#accentText)">Trilhas</text>

  <!-- Tagline -->
  <text x="93" y="62" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#71717a" letter-spacing="0.5">Sua jornada cloud começa aqui</text>

  <!-- Linha decorativa sob o texto -->
  <rect x="93" y="67" width="40" height="2" rx="1" fill="url(#accentText)" opacity="0.5"/>
</svg>
