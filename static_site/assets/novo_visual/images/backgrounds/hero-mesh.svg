<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grid sutil -->
    <pattern id="heroGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" stroke="#6366f1" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>

    <!-- Orbs de cor -->
    <radialGradient id="meshOrb1" cx="0.25" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshOrb2" cx="0.75" cy="0.2" r="0.35">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshOrb3" cx="0.5" cy="0.8" r="0.3">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshOrb4" cx="0.9" cy="0.7" r="0.25">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grid base -->
  <rect width="1600" height="900" fill="url(#heroGrid)"/>

  <!-- Orbs flutuantes -->
  <ellipse cx="400" cy="270" rx="380" ry="320" fill="url(#meshOrb1)"/>
  <ellipse cx="1200" cy="180" rx="320" ry="280" fill="url(#meshOrb2)"/>
  <ellipse cx="800" cy="720" rx="350" ry="250" fill="url(#meshOrb3)"/>
  <ellipse cx="1400" cy="630" rx="280" ry="220" fill="url(#meshOrb4)"/>

  <!-- Constelação de pontos -->
  <circle cx="200" cy="150" r="2.5" fill="#818cf8" opacity="0.4"/>
  <circle cx="380" cy="100" r="2" fill="#a5b4fc" opacity="0.5"/>
  <circle cx="550" cy="180" r="3" fill="#06b6d4" opacity="0.35"/>
  <circle cx="750" cy="120" r="2" fill="#67e8f9" opacity="0.4"/>
  <circle cx="950" cy="200" r="2.5" fill="#818cf8" opacity="0.3"/>
  <circle cx="1100" cy="100" r="2" fill="#f0abfc" opacity="0.35"/>
  <circle cx="1300" cy="180" r="3" fill="#6366f1" opacity="0.3"/>
  <circle cx="1450" cy="120" r="2" fill="#06b6d4" opacity="0.25"/>

  <circle cx="150" cy="400" r="2" fill="#a855f7" opacity="0.2"/>
  <circle cx="400" cy="500" r="2.5" fill="#06b6d4" opacity="0.2"/>
  <circle cx="700" cy="450" r="2" fill="#818cf8" opacity="0.25"/>
  <circle cx="1000" cy="380" r="3" fill="#67e8f9" opacity="0.2"/>
  <circle cx="1250" cy="450" r="2" fill="#f0abfc" opacity="0.2"/>
  <circle cx="1500" cy="400" r="2.5" fill="#6366f1" opacity="0.2"/>

  <!-- Linhas de constelação -->
  <line x1="200" y1="150" x2="380" y2="100" stroke="#818cf8" stroke-opacity="0.08" stroke-width="0.8"/>
  <line x1="380" y1="100" x2="550" y2="180" stroke="#a5b4fc" stroke-opacity="0.06" stroke-width="0.8"/>
  <line x1="550" y1="180" x2="750" y2="120" stroke="#06b6d4" stroke-opacity="0.06" stroke-width="0.8"/>
  <line x1="950" y1="200" x2="1100" y2="100" stroke="#818cf8" stroke-opacity="0.05" stroke-width="0.8"/>
  <line x1="1100" y1="100" x2="1300" y2="180" stroke="#f0abfc" stroke-opacity="0.06" stroke-width="0.8"/>

  <!-- Hexágonos decorativos (estilo tech) -->
  <path d="M100 600L115 592L130 600L130 616L115 624L100 616Z" stroke="#6366f1" stroke-opacity="0.06" stroke-width="1" fill="none"/>
  <path d="M1400 300L1415 292L1430 300L1430 316L1415 324L1400 316Z" stroke="#06b6d4" stroke-opacity="0.06" stroke-width="1" fill="none"/>
  <path d="M800 700L815 692L830 700L830 716L815 724L800 716Z" stroke="#a855f7" stroke-opacity="0.05" stroke-width="1" fill="none"/>

  <!-- Anéis decorativos -->
  <circle cx="300" cy="700" r="40" stroke="#6366f1" stroke-opacity="0.04" stroke-width="1" fill="none"/>
  <circle cx="300" cy="700" r="60" stroke="#6366f1" stroke-opacity="0.02" stroke-width="1" fill="none"/>
  <circle cx="1350" cy="500" r="35" stroke="#06b6d4" stroke-opacity="0.04" stroke-width="1" fill="none"/>
  <circle cx="1350" cy="500" r="55" stroke="#06b6d4" stroke-opacity="0.02" stroke-width="1" fill="none"/>
</svg>
